name: Nova Nexus 3 Engine Bot

# No-overlap guard: only one run executes at a time. A newly queued run
# WAITS for the active run to finish instead of cancelling it, so the
# healthy bot is never killed before its replacement is ready.
# (cancel-in-progress is intentionally off: killing the active run up-front
# would take the bot offline if the replacement fails during runner,
# Python, or dependency setup.)
# Need an immediate restart? Cancel the active run first, then dispatch.
concurrency:
  group: nova-nexus-bot-singleton


# Always-on: a fresh run starts every 5 hours (each run is capped at 6h by
# GitHub). The new run's identify cleanly takes over the token from the
# previous run, which exits instead of fighting (NOVA_RECONNECT=0).
# Manual runs: Actions tab -> "Nova Nexus 3 Engine Bot" -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: Novaengine 3
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for shutdown marker
        id: shutdown_check
        run: |
          if [ -f SHUTDOWN ]; then
            echo "marker=true" >> "$GITHUB_OUTPUT"
            echo "SHUTDOWN marker present — the bot was shut down and must stay off."
            cat SHUTDOWN
          else
            echo "marker=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        if: steps.shutdown_check.outputs.marker != 'true'
        run: python -u nova_nexus_bot.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOVA_RECONNECT: "0"
          GUILD_ID: "1547377379243204740"
          RULES_TOKEN: ${{ secrets.RULES_TOKEN }}
