name: Nova Nexus 3 Engine Bot

# Always-on: a fresh run starts every 5 hours (each run is capped at 6h by
# GitHub). The new run's identify cleanly takes over the token from the
# previous run, which exits instead of fighting (NOVA_RECONNECT=0).
# Manual runs: Actions tab -> "Nova Nexus 3 Engine Bot" -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        run: python -u nova_nexus_bot.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          NOVA_RECONNECT: "0"
          GUILD_ID: "1547377379243204740"
